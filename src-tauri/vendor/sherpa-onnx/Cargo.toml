[package]
name = "sherpa-onnx"
version = "1.13.4"
edition = "2021"
description = "Minimal safe bindings used by Mutsuna's on-demand local AI runtime"
license = "Apache-2.0"

[features]
default = []
shared = []
static = []

[lib]
name = "sherpa_onnx"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sherpa-onnx-sys = { path = "../sherpa-onnx-sys", default-features = false }
