[package]
name = "mutsuna-echo"
version = "0.1.4"
description = "A cross-platform recording and pluggable transcription app"
authors = ["Mutsuna Studio"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mutsuna_echo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13.4", features = ["json", "multipart", "query", "stream"] }
secrecy = "0.10.3"
zeroize = "1.9.0"
lofty = "0.24.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-opener = "2"
sha2 = "0.10.9"
uuid = { version = "1", features = ["v7"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "pcm", "wav"] }
sonora = "0.2.0"
zip = { version = "4", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
tauri-plugin-process = "2"

[dev-dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_WinRT", "Win32_Media_MediaFoundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
flexaudio = "0.2.0"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
sherpa-onnx = { version = "1.13.4", default-features = false, features = ["shared"] }

[target.'cfg(target_os = "macos")'.dependencies]
flexaudio = "0.2.0"
avassetwriter = "0.11.1"
core-foundation = "0.10.1"
core-graphics = "0.25.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
jni_0_22 = { package = "jni", version = "0.22.4" }
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7.0"

[target.'cfg(all(not(target_os = "windows"), not(target_os = "android")))'.dependencies]
keyring = "4.1.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
