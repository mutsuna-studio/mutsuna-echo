name: Google Drive internal testing
on:
  push:
    branches: [codex/drive-internal-release]
permissions:
  contents: read
concurrency:
  group: google-drive-internal
  cancel-in-progress: false
env:
  MUTSUNA_CLOUDFLARE_OAUTH_CLIENT_ID: ${{ vars.MUTSUNA_CLOUDFLARE_OAUTH_CLIENT_ID }}
jobs:
  build-android:
    name: Build signed Android AAB
    runs-on: ubuntu-latest
    environment:
      name: release-android
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Android build toolchain
        uses: ./.github/actions/setup-android-build
        with:
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check

      - name: Verify release version
        run: node scripts/verify-release-version.mjs v0.1.10

      - name: Test Android credential contracts
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:testUniversalDebugUnitTest

      - name: Prepare Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node -e "for (const name of ['ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD']) if (!process.env[name]) throw new Error('Missing GitHub Secret: ' + name)"
          key_path="$RUNNER_TEMP/mutsuna-echo-upload.jks"
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.ANDROID_KEYSTORE_BASE64, 'base64'))" "$key_path"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$key_path" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > src-tauri/gen/android/keystore.properties

      - name: Build signed AAB
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        with:
          mobile: android
          args: --aab --target aarch64

      - name: Verify AAB signature
        id: verify-android
        shell: bash
        run: |
          aab_path="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$aab_path"
          jarsigner -verify "$aab_path" > "$RUNNER_TEMP/aab-signature-verification.txt"
          grep -q "jar verified" "$RUNNER_TEMP/aab-signature-verification.txt"
          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"

      - name: Verify local AI is isolated in the on-demand feature
        shell: bash
        run: |
          aab_path="${{ steps.verify-android.outputs.aab_path }}"
          unzip -l "$aab_path" > "$RUNNER_TEMP/aab-files.txt"
          if grep -E 'base/lib/arm64-v8a/(libonnxruntime|libsherpa-onnx-c-api)\.so' "$RUNNER_TEMP/aab-files.txt"; then
            echo "::error::Local AI runtime leaked into the base Android module."
            exit 1
          fi
          grep -E 'local_ai_runtime/lib/arm64-v8a/libonnxruntime\.so' "$RUNNER_TEMP/aab-files.txt"
          grep -E 'local_ai_runtime/lib/arm64-v8a/libsherpa-onnx-c-api\.so' "$RUNNER_TEMP/aab-files.txt"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aarch64-aab
          path: ${{ steps.verify-android.outputs.aab_path }}
          if-no-files-found: error


      - name: Publish only to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: jp.mutsuna.echo
          releaseFiles: ${{ steps.verify-android.outputs.aab_path }}
          tracks: internal
          status: completed
          changesNotSentForReview: false
