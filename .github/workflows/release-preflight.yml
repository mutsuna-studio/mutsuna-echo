name: Release preflight

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Distribution artifact to verify without publishing a release
        type: choice
        required: true
        default: all
        options:
          - all
          - desktop
          - android

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Preflight ${{ matrix.name }}
    if: inputs.platform == 'all' || inputs.platform == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows NSIS
            selector: windows
            platform: windows-latest
            runtime_platform: windows
            runtime_target: ""
            build_args: --bundles nsis
            environment: release-windows
            artifact_name: windows-nsis-preflight
            artifact_path: src-tauri/target/release/bundle/nsis
          - name: macOS Apple Silicon
            selector: macos
            platform: macos-latest
            runtime_platform: macos
            runtime_target: aarch64-apple-darwin
            build_args: --target aarch64-apple-darwin --bundles app,dmg
            environment: release-macos
            artifact_name: macos-apple-silicon-preflight
            artifact_path: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos

    runs-on: ${{ matrix.platform }}
    environment:
      name: ${{ matrix.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.runtime_target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check

      - name: Prepare desktop runtime libraries
        shell: pwsh
        run: >-
          ./scripts/prepare-desktop-runtime.ps1
          -Platform ${{ matrix.runtime_platform }}
          ${{ matrix.runtime_target && format('-Target {0}', matrix.runtime_target) || '' }}

      - name: Configure macOS signing
        if: matrix.selector == 'macos'
        shell: bash
        env:
          MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'adhoc' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          case "$MACOS_SIGNING_MODE" in
            adhoc)
              echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
              ;;
            developer-id)
              for name in \
                APPLE_CERTIFICATE \
                APPLE_CERTIFICATE_PASSWORD \
                APPLE_SIGNING_IDENTITY_SECRET \
                APPLE_API_ISSUER \
                APPLE_API_KEY \
                APPLE_API_PRIVATE_KEY
              do
                if [ -z "${!name:-}" ]; then
                  echo "::error::Missing release-macos secret: $name"
                  exit 1
                fi
              done

              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
              node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_API_PRIVATE_KEY, 'base64'))" "$key_path"
              echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::MACOS_SIGNING_MODE must be 'adhoc' or 'developer-id'."
              exit 1
              ;;
          esac

      - name: Build distribution bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: pnpm tauri build ${{ matrix.build_args }}

      - name: Verify Windows distribution bundle
        if: matrix.selector == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'The NSIS installer was not generated.' }
          if (-not (Test-Path -LiteralPath "$($installer.FullName).sig")) { throw 'The NSIS updater signature was not generated.' }

      - name: Verify macOS distribution bundle
        if: matrix.selector == 'macos'
        shell: pwsh
        run: |
          $bundleRoot = 'src-tauri/target/aarch64-apple-darwin/release/bundle'
          if (-not (Get-ChildItem "$bundleRoot/dmg" -Filter '*.dmg' | Select-Object -First 1)) { throw 'The macOS DMG was not generated.' }
          if (-not (Get-ChildItem "$bundleRoot/macos" -Filter '*.app' | Select-Object -First 1)) { throw 'The macOS app bundle was not generated.' }

      - name: Upload preflight artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  android:
    name: Preflight Android signed AAB
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    environment:
      name: release-android
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check

      - name: Prepare Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node -e "for (const name of ['ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD']) if (!process.env[name]) throw new Error('Missing GitHub Secret: ' + name)"
          key_path="$RUNNER_TEMP/mutsuna-echo-upload.jks"
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.ANDROID_KEYSTORE_BASE64, 'base64'))" "$key_path"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$key_path" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > src-tauri/gen/android/keystore.properties

      - name: Build signed AAB
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        with:
          mobile: android
          args: --aab --target aarch64

      - name: Verify AAB signature
        id: verify-android
        shell: bash
        run: |
          aab_path="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$aab_path"
          jarsigner -verify "$aab_path" > "$RUNNER_TEMP/aab-signature-verification.txt"
          grep -q "jar verified" "$RUNNER_TEMP/aab-signature-verification.txt"
          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aarch64-aab-preflight
          path: ${{ steps.verify-android.outputs.aab_path }}
          if-no-files-found: error
