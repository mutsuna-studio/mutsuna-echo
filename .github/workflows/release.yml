name: Release applications

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify tag and application versions
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

  publish:
    name: Build ${{ matrix.name }}
    needs: validate-release
    permissions:
      contents: write
    environment:
      name: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows NSIS
            platform: windows-latest
            args: --bundles nsis
            adhocArgs: --bundles nsis
            environment: release-windows
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            adhocArgs: --target aarch64-apple-darwin --bundles app,dmg
            environment: release-macos

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin' || '' }}

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.environment }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check

      - name: Prepare desktop runtime libraries
        shell: pwsh
        run: >-
          ./scripts/prepare-desktop-runtime.ps1
          -Platform ${{ startsWith(matrix.name, 'macOS') && 'macos' || 'windows' }}
          ${{ startsWith(matrix.name, 'macOS') && '-Target aarch64-apple-darwin' || '' }}

      - name: Configure macOS signing
        if: startsWith(matrix.name, 'macOS')
        shell: bash
        env:
          MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'adhoc' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          case "$MACOS_SIGNING_MODE" in
            adhoc)
              cp src-tauri/tauri.macos-adhoc.conf.json src-tauri/tauri.macos.conf.json
              echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
              ;;
            developer-id)
              for name in \
                APPLE_CERTIFICATE \
                APPLE_CERTIFICATE_PASSWORD \
                APPLE_SIGNING_IDENTITY_SECRET \
                APPLE_API_ISSUER \
                APPLE_API_KEY \
                APPLE_API_PRIVATE_KEY
              do
                if [ -z "${!name:-}" ]; then
                  echo "::error::Missing release-macos secret: $name"
                  exit 1
                fi
              done

              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
              node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_API_PRIVATE_KEY, 'base64'))" "$key_path"
              echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::MACOS_SIGNING_MODE must be 'adhoc' or 'developer-id'."
              exit 1
              ;;
          esac

      - name: Build and publish release
        if: >-
          !startsWith(matrix.name, 'macOS') ||
          vars.MACOS_SIGNING_MODE != 'developer-id'
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Mutsuna Echo __VERSION__
          releaseBody: |
            Mutsuna Echo __VERSION__

            WindowsではNSISセットアップ（.exe）のみを配布します。
            macOS署名: ${{ vars.MACOS_SIGNING_MODE == 'developer-id' && 'Developer ID署名・Notarization済み' || 'アドホック署名（未Notarization。初回起動時にmacOSの手動許可が必要）' }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.adhocArgs }}

      - name: Build and publish Developer ID release
        if: >-
          startsWith(matrix.name, 'macOS') &&
          vars.MACOS_SIGNING_MODE == 'developer-id'
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Mutsuna Echo __VERSION__
          releaseBody: |
            Mutsuna Echo __VERSION__

            WindowsではNSISセットアップ（.exe）のみを配布します。
            macOS署名: Developer ID署名・Notarization済み
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Verify macOS bundle and launch
        if: startsWith(matrix.name, 'macOS')
        shell: bash
        env:
          MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'adhoc' }}
        run: |
          app_path="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/mutsuna-echo.app"
          executable="$app_path/Contents/MacOS/mutsuna-echo"
          launch_log="$RUNNER_TEMP/mutsuna-echo-launch.log"

          codesign --verify --deep --strict --verbose=2 "$app_path"

          if [ "$MACOS_SIGNING_MODE" = "adhoc" ]; then
            entitlements_path="$RUNNER_TEMP/mutsuna-echo-entitlements.plist"
            codesign --display --entitlements "$entitlements_path" "$executable"
            if grep -F -A 1 '<key>com.apple.security.cs.disable-library-validation</key>' "$entitlements_path" | grep -Fq '<true/>'; then
              entitlement_present=true
            elif grep -F -A 2 '[Key] com.apple.security.cs.disable-library-validation' "$entitlements_path" | grep -Fq '[Bool] true'; then
              entitlement_present=true
            else
              entitlement_present=false
            fi
            if [ "$entitlement_present" != "true" ]; then
              cat "$entitlements_path" || true
              echo "::error::The ad-hoc application is missing the Disable Library Validation entitlement."
              exit 1
            fi
          fi

          "$executable" >"$launch_log" 2>&1 &
          app_pid=$!
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            exit_code=1
            wait "$app_pid" || exit_code=$?
            cat "$launch_log"
            echo "::error::The packaged macOS application exited during the launch smoke test."
            exit "$exit_code"
          fi

          kill "$app_pid" 2>/dev/null || true
          wait "$app_pid" 2>/dev/null || true

  build-android:
    name: Build and publish signed Android AAB
    needs: validate-release
    runs-on: ubuntu-latest
    environment:
      name: release-android
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: release-android-aarch64
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check

      - name: Prepare Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node -e "for (const name of ['ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD']) if (!process.env[name]) throw new Error('Missing GitHub Secret: ' + name)"
          key_path="$RUNNER_TEMP/mutsuna-echo-upload.jks"
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.ANDROID_KEYSTORE_BASE64, 'base64'))" "$key_path"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$key_path" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > src-tauri/gen/android/keystore.properties

      - name: Build signed AAB
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        with:
          mobile: android
          args: --aab --target aarch64

      - name: Verify AAB signature
        id: verify-android
        shell: bash
        run: |
          aab_path="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$aab_path"
          jarsigner -verify "$aab_path" > "$RUNNER_TEMP/aab-signature-verification.txt"
          grep -q "jar verified" "$RUNNER_TEMP/aab-signature-verification.txt"
          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aarch64-aab
          path: ${{ steps.verify-android.outputs.aab_path }}
          if-no-files-found: error

      - name: Validate Google Play credentials
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing release-android secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          node -e "JSON.parse(process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON)"

      - name: Publish to Google Play production
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: jp.mutsuna.echo
          releaseFiles: ${{ steps.verify-android.outputs.aab_path }}
          track: production
          status: completed
          changesNotSentForReview: false
          releaseName: ${{ github.ref_name }}
          whatsNewDirectory: distribution/whatsnew
