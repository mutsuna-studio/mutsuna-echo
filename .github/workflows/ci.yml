name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Build frontend
        run: pnpm build

  rust:
    name: Rust tests and Clippy
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Runtime DLLs are release bundle resources. CI compiles and tests the
      # application but does not create an installer, so do not require them.
      TAURI_CONFIG: '{"bundle":{"resources":null}}'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Restore Rust CI cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: ci-windows
          cache-on-failure: true

      - name: Prepare native test libraries
        shell: pwsh
        run: ./scripts/prepare-desktop-runtime.ps1 -Platform windows

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  warm-desktop-release-cache:
    name: Warm ${{ matrix.name }} release cache
    if: github.event_name == 'push'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            target: ""
            cache-key: release-windows
            runtime-platform: windows
            runtime-args: ""
            build-args: --no-bundle
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            cache-key: release-macos
            runtime-platform: macos
            runtime-args: -Target aarch64-apple-darwin
            build-args: --no-bundle --target aarch64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Restore Rust release cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.cache-key }}

      - name: Install frontend dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Prepare desktop runtime libraries
        if: steps.rust-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: >-
          ./scripts/prepare-desktop-runtime.ps1
          -Platform ${{ matrix.runtime-platform }}
          ${{ matrix.runtime-args }}

      - name: Warm release build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: pnpm tauri build ${{ matrix.build-args }}
