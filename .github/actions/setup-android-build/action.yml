name: Set up Android build toolchain
description: Set up the shared Android, Rust, Gradle, and sccache environment.

inputs:
  rust-cache-key:
    description: Shared key used by the Rust dependency cache.
    required: false
    default: release-android-aarch64
  cache-on-failure:
    description: Save the Rust dependency cache when a later step fails.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

    - name: Install Android SDK and NDK
      shell: bash
      run: |
        sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: stable
        targets: aarch64-linux-android

    - name: Restore Rust dependency cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri -> target
        shared-key: ${{ inputs.rust-cache-key }}
        cache-on-failure: ${{ inputs.cache-on-failure }}

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.16.0

    - name: Enable sccache for Rust
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
