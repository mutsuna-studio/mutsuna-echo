name: Set up Android build toolchain
description: Set up the shared Android, Rust, Gradle, and sccache environment.

inputs:
  rust-cache-key:
    description: Shared key used by the Rust dependency cache.
    required: false
    default: release-android-aarch64
  cache-on-failure:
    description: Save the Rust dependency cache when a later step fails.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

    - name: Install Android SDK and NDK
      shell: bash
      run: |
        sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: stable
        targets: aarch64-linux-android

    - name: Download signed local AI Dynamic Feature runtime
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y minisign
        version="1.13.4-1"
        asset="mutsuna-local-ai-runtime-v${version}-android-arm64.zip"
        url="https://github.com/mutsuna-studio/mutsuna-echo/releases/download/local-ai-runtime-v${version}/${asset}"
        mkdir -p "$RUNNER_TEMP/local-ai-runtime" "src-tauri/gen/android/local_ai_runtime/src/main/jniLibs/arm64-v8a"
        curl --fail --location --retry 5 --output "$RUNNER_TEMP/local-ai-runtime/$asset" "$url"
        curl --fail --location --retry 5 --output "$RUNNER_TEMP/local-ai-runtime/$asset.sig" "$url.sig"
        printf '%s\n%s\n' \
          'untrusted comment: minisign public key: 1EE92D443A7A97CA' \
          'RWTKl3o6RC3pHpQe7ilIUo5clZxt6vyrf+WplGxhzK/lI/p7zrlNAok+' \
          > "$RUNNER_TEMP/local-ai-runtime/minisign.pub"
        minisign -Vm "$RUNNER_TEMP/local-ai-runtime/$asset" \
          -x "$RUNNER_TEMP/local-ai-runtime/$asset.sig" \
          -p "$RUNNER_TEMP/local-ai-runtime/minisign.pub"
        unzip -q "$RUNNER_TEMP/local-ai-runtime/$asset" -d "$RUNNER_TEMP/local-ai-runtime/extracted"
        cp "$RUNNER_TEMP/local-ai-runtime/extracted/libonnxruntime.so" \
           "$RUNNER_TEMP/local-ai-runtime/extracted/libsherpa-onnx-c-api.so" \
           src-tauri/gen/android/local_ai_runtime/src/main/jniLibs/arm64-v8a/

    - name: Restore Rust dependency cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri -> target
        shared-key: ${{ inputs.rust-cache-key }}
        cache-on-failure: ${{ inputs.cache-on-failure }}

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.16.0

    - name: Enable sccache for Rust
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
